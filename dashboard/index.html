<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DontPanic — Local Operating Console</title>
  <link rel="stylesheet" href="core.css">
  <link rel="stylesheet" href="components.css">
  <!-- Plan 2026-06-05-003 F005 — page CSS is loaded ONLY for pages registered in
       pageModules (core.js). The orphan pages (command-center / financial /
       cloud-costs / security) were retired: their stylesheets redefined generic
       selectors (.empty-state, .status-badge, .grid-2col, …) and silently
       restyled the live pages via last-wins cascade. Repair carries no own CSS —
       it migrated onto components.css. -->
  <link rel="stylesheet" href="pages/what-now/what-now.css">
  <link rel="stylesheet" href="pages/mission-control/mission-control.css">
  <link rel="stylesheet" href="pages/capabilities/capabilities.css">
  <link rel="stylesheet" href="pages/architecture/architecture.css">
  <link rel="stylesheet" href="pages/health/health.css">
  <link rel="stylesheet" href="pages/settings/settings.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <header>
    <div class="header-left">
      <h1>DontPanic</h1>
      <span class="subtitle">Local Operating Console</span>
    </div>
    <div class="header-right">
      <span id="sync-status" class="status-badge idle">Checking...</span>
      <span id="clock"></span>
    </div>
  </header>

  <nav class="view-nav" id="view-nav">
    <!-- Tabs injected by page registration -->
  </nav>

  <div id="project-selector-container" class="project-selector-bar">
    <!-- F003 project selector injected by core.js -->
  </div>

  <main id="main">
    <div id="page-container">
      <!-- Page content loaded dynamically -->
    </div>
  </main>

  <footer>
    <span>DontPanic dashboard v0 — local-first</span>
    <span id="last-sync">Last sync: --</span>
  </footer>

  <script type="module" src="core.js"></script>
</body>
</html>
