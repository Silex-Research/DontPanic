# Dependabot configuration — DontPanic platform
#
# F003 narrowed-promise framing (per plan 2026-05-01-003 D003):
#
#   github-actions ecosystem  = SECURITY-OWNED. Dependabot is the canonical
#                               source of pin rotations for `uses:` lines in
#                               .github/workflows/*.yml. Pins are SHA-pinned
#                               with tag comments; the bot updates both atomically.
#
#   pip ecosystem             = CONFIGURED BUT CURRENTLY NO-OP. Dependabot's pip
#                               ecosystem requires a supported Python dependency
#                               manifest (requirements*.txt, pyproject.toml with
#                               PEP 621 [project], Pipfile, etc.). DontPanic's
#                               pyproject.toml now has an active PEP 621
#                               [project.dependencies] manifest, so Dependabot's
#                               pip ecosystem is active visibility for runtime
#                               dependency updates. Hash-pinning, lockfile
#                               enforcement, and pip-audit remain DEFERRED to a
#                               future dep-security plan.
#
# See:
#   docs/plans/2026-05-01-003-feat-security-baseline/decisions.jsonl D003
#   docs/plans/2026-05-01-003-feat-security-baseline/decisions.jsonl D004 (deferral list)
#   CONTRIBUTING.md / docs/maintenance.md "Dependency maintenance" section

version: 2
updates:
  # github-actions: security-owned ecosystem.
  # Bot manages SHA pin rotation for actions/checkout, actions/setup-python, etc.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
      - "security-owned"

  # pip: active visibility for pyproject.toml [project.dependencies].
  # Lockfile/hash enforcement remains deferred to a dedicated dep-security plan.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
      - "security-owned"
