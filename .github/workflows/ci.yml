name: CI

on:
  pull_request:
  push:
    branches: [main]

# Default GITHUB_TOKEN is read/write across most scopes. Pin to least-
# privilege at the workflow root; jobs that need writes (release, pages,
# packages) opt in by overriding `permissions:` at the job level. Closes
# pwn-request-style risk where a malicious PR uses workflow scopes the
# job didn't actually need.
permissions:
  contents: read

jobs:
  python:
    name: Python — tests + schema + security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies from uv.lock
        # The lockfile governs CI and dev installs (2026-09-05): pip never read
        # uv.lock, so a green CI run said nothing about the pinned versions and
        # a lock-only security bump (cryptography) was unverified. `--locked`
        # fails when uv.lock is stale against pyproject.toml (--frozen would
        # silently install a stale lock), so CI tests exactly what is
        # committed AND proves the lock matches the declared dependencies.
        run: |
          python -m pip install --upgrade pip uv
          uv sync --locked --extra dev --extra firebase
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -c "import cryptography, firebase_admin; print('cryptography', cryptography.__version__)"

      - name: Git identity for synthetic-repo tests
        # Several tests create temporary git repositories and commit fixtures.
        # Public CI must not inherit maintainer signing configuration, and
        # GitHub runners need an explicit identity for those synthetic commits.
        run: |
          git config --global user.name "DontPanic CI"
          git config --global user.email "dontpanic-ci@example.invalid"
          git config --global commit.gpgsign false

      - name: CI doctor fixture environment
        # The doctor tests exercise --skip-auth behavior, not real Firebase
        # auth. Give the runner a harmless firebase executable + target project
        # so advisory-mode plan-validation tests are not polluted by missing
        # local operator tooling.
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/usr/bin/env sh\nexit 0\n' > "$RUNNER_TEMP/bin/firebase"
          chmod +x "$RUNNER_TEMP/bin/firebase"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "DONTPANIC_FIREBASE_PROJECT=ci-placeholder" >> "$GITHUB_ENV"
          echo "JARVIS_FIREBASE_PROJECT=ci-placeholder" >> "$GITHUB_ENV"

      - name: Pydantic schema imports
        # Loads every promoted v1.0 Pydantic model. Same set jarvis_doctor checks.
        run: |
          PYTHONPATH=claude/shared/schemas/v1.0 \
            python -c "from models import plan_model, features_model, audit_model, environments_model, signoff_model; print('schema models import OK')"

      - name: pytest
        run: PYTHONPATH=scripts pytest scripts/dontpanic_orchestrate/tests/ -q

      - name: dontpanic_doctor — structural checks (gcloud/firebase auth omitted)
        # CI runs --skip-auth: gcloud + firebase aren't authenticated here, but
        # every structural check (schemas, Pydantic models, parent plan, .secrets/
        # gitignore) must still be green.
        run: python scripts/dontpanic_doctor.py --skip-auth

      - name: Eval — regression suite (gates the build)
        run: |
          chmod +x scripts/run-eval-suite.sh
          PYTHONPATH=scripts bash scripts/run-eval-suite.sh regression
      - name: Upload regression eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-regression
          path: eval-regression.json
          if-no-files-found: warn

      - name: Sanitization — no campaign IDs in committed surface
        # Scans every file that would land in `git add .` (tracked, staged,
        # and untracked-not-ignored) for the campaign project ID, billing
        # account, and maintainer-personal identifiers. Allowed only under
        # docs/plans (audit/evidence), tests (fixtures), dashboard/state,
        # and the CONTRIBUTING note that explicitly references the campaign
        # as a counter-example. See scripts/sanitization_check.py for the
        # full allowlist.
        run: python3 scripts/sanitization_check.py

  eval-capability:
    name: Eval — capability suite (never gates)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies from uv.lock
        run: |
          python -m pip install --upgrade pip uv
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Eval — capability suite
        run: |
          chmod +x scripts/run-eval-suite.sh
          PYTHONPATH=scripts bash scripts/run-eval-suite.sh capability
      - name: Upload capability eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-capability
          path: eval-capability.json
          if-no-files-found: warn

  shell:
    name: Shell — bootstrap.sh syntax + arg validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: bash -n (syntax)
        run: bash -n scripts/bootstrap.sh

      - name: bootstrap.sh aborts when --project missing
        run: |
          set +e
          out=$(bash scripts/bootstrap.sh 2>&1)
          rc=$?
          [ $rc -eq 2 ] || { echo "expected exit 2, got $rc"; echo "$out"; exit 1; }
          echo "$out" | grep -q "missing --project" || { echo "missing remediation message"; exit 1; }

      - name: bootstrap.sh aborts when --billing-account missing
        run: |
          set +e
          out=$(bash scripts/bootstrap.sh --project test-id 2>&1)
          rc=$?
          [ $rc -eq 2 ] || { echo "expected exit 2, got $rc"; echo "$out"; exit 1; }
          echo "$out" | grep -q "missing --billing-account" || { echo "missing remediation message"; exit 1; }

      - name: bootstrap.sh rejects malformed billing account
        run: |
          set +e
          out=$(bash scripts/bootstrap.sh --project test-id --billing-account not-an-id 2>&1)
          rc=$?
          [ $rc -eq 2 ] || { echo "expected exit 2, got $rc"; echo "$out"; exit 1; }
          echo "$out" | grep -q "does not look like" || { echo "missing format hint"; exit 1; }
