<!doctype html><html><head><meta charset="utf-8"><title>selector — All Projects (8-project fleet)</title></head><body>
    <div class="project-selector" data-state="ready">
      <label class="project-selector-label" for="project-selector-input">Project</label>
      <select class="project-selector-input"
              id="project-selector-input"
              data-project-selector="1"
              aria-label="Selected project">
        <option value="all" selected>All Projects</option><option value="alpha-app">Alpha App</option><option value="beta-backend">Beta Backend</option><option value="gamma-schema">Gamma Schema</option><option value="delta-dashboard">Delta Dashboard</option><option value="epsilon-cli">Epsilon Cli</option><option value="zeta-experimental">Zeta Experimental (inactive)</option><option value="eta-archived">Eta Archived</option><option value="theta-missing">Theta Missing</option>
      </select>
      
    <span class="scope-badge scope-badge--fleet" data-scope="fleet">
      <span class="scope-badge-label">Scope:</span>
      <span class="scope-badge-value">Fleet</span>
    </span>
  
      
    <div class="project-selector-add" data-add-project="1">
      <span class="project-selector-add-label">Add project</span>
      <code class="project-selector-add-cmd">dontpanic projects add &lt;name&gt; &lt;path&gt;</code>
    </div>
  
    </div>

      </select>

    </span>
