<!doctype html><html><head><meta charset="utf-8"><title>selector — alpha-app (two-project fleet)</title></head><body>
    <div class="project-selector" data-state="ready">
      <label class="project-selector-label" for="project-selector-input">Project</label>
      <select class="project-selector-input"
              id="project-selector-input"
              data-project-selector="1"
              aria-label="Selected project">
        <option value="all">All Projects</option><option value="alpha-app" selected>Alpha Mobile App</option><option value="beta-backend">Beta Backend</option>
      </select>
      
    <span class="scope-badge scope-badge--project" data-scope="project">
      <span class="scope-badge-label">Scope:</span>
      <span class="scope-badge-value">Project</span>
    </span>
  
      
    <div class="project-selector-add" data-add-project="1">
      <span class="project-selector-add-label">Add project</span>
      <code class="project-selector-add-cmd">dontpanic projects add &lt;name&gt; &lt;path&gt;</code>
    </div>
  
    </div>
