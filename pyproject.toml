[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Canonical: `dontpanic_orchestrate` is the implementation; `jarvis_orchestrate`
# is a non-removing compatibility shim that re-exports + emits one
# `DeprecationWarning` per process. Plan
# 2026-05-04-001-refactor-canonical-dontpanic-module flipped the direction;
# both the `dontpanic` and `jarvis` console scripts resolve to the canonical
# entrypoint per D004.
name = "dontpanic-orchestrate"
description = "The safety layer between the agent says it's done and you merge it."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Silex Research" }]
keywords = [
    "dontpanic",
    "ai",
    "agents",
    "code-review",
    "mcp-server",
    "ai-orchestration",
    "multi-agent",
    "local-first",
    "claude",
    "codex",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]
dynamic = ["version"]

[project.optional-dependencies]
firebase = ["firebase-admin>=6.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
# Both the canonical command and the legacy alias resolve to the canonical
# entrypoint per plan 2026-05-04-001 D004. The shim's `__main__.py` also
# accepts `python -m jarvis_orchestrate` for backward compatibility (with
# a single DeprecationWarning).
dontpanic = "dontpanic_orchestrate.cli:main"
jarvis = "dontpanic_orchestrate.cli:main"

[project.urls]
Homepage = "https://github.com/Silex-Research/DontPanic"
Repository = "https://github.com/Silex-Research/DontPanic"
Issues = "https://github.com/Silex-Research/DontPanic/issues"

[tool.setuptools.dynamic]
version = { attr = "dontpanic_orchestrate.__version__" }

[tool.setuptools.packages.find]
# Package source lives under `scripts/`. Canonical first, shim second.
# Tests are excluded under the canonical path; the shim has no tests.
where = ["scripts"]
include = ["dontpanic_orchestrate*", "jarvis_orchestrate*"]
exclude = ["dontpanic_orchestrate.tests*"]

[tool.ruff]
target-version = "py310"
line-length = 100

# Tracked Python lives in scripts/. Vendored upstream code under
# claude/shared/ is maintained in agent-conventions and is excluded from
# our enforcement surface.
extend-exclude = [
  "claude/shared",
  "**/__pycache__",
  ".secrets",
  "research",
  "codex",
  "gemini",
]

[tool.ruff.lint]
# Curated rule set, scoped honestly. Expanding rules later is cheap;
# starting with too much is what produces "allowed-failure" jobs.
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes (unused imports, undefined names, …)
  "W",   # pycodestyle warnings
  "I",   # import sorting
  "UP",  # pyupgrade — modernize syntax
  "B",   # flake8-bugbear — likely-bug patterns
  "S",   # flake8-bandit (security) — baseline lint, NOT a SAST substitute. Plan 2026-05-08-001.
]
ignore = [
  "E501",  # line length — relax; format handles wrapping
  "B008",  # function-call default arg (used intentionally for argparse, click)
]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to use unused fixture-style locals + asserts that
# would otherwise read as bugbear false positives.
# S-rules ignored under tests/ are EXACTLY the four below. Each is
# a test-idiom pattern, not a runtime security posture concern:
#   S101 — `assert` is idiomatic test syntax (pytest uses bare assert).
#   S607 — `subprocess.run(["git", "init", ...])` for real-repo fixtures.
#   S108 — hardcoded /tmp paths in test setup (when not using tmp_path).
#   S603 — subprocess invocations testing shape with shell=False default.
# Plan 2026-05-08-001 D002 + D007 records this scoping. Adding any rule to
# this list requires updating tests/test_pyproject_security_carve_out.py
# which asserts the tuple matches exactly. S104 / S110 / S310 are NOT
# included because their test-side count is ≤1 — the carve-out is for
# repeated test-fixture patterns, not blanket exemption.
"**/tests/**" = ["B011", "S101", "S603", "S607", "S108"]

[tool.ruff.format]
# Default style; explicit so future updates don't surprise us.
quote-style = "double"
indent-style = "space"
